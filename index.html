<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Money Log" />
  <title>Money Log</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <header class="header">
      <div class="month-label" id="monthLabel"></div>
    </header>

    <main class="main">
      <!-- SVG reset ring drawn around the button -->
      <svg class="reset-ring" id="resetRingSvg" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
        <circle class="reset-ring-track" cx="140" cy="140" r="132"/>
        <circle class="reset-ring-fill" id="resetRingFill" cx="140" cy="140" r="132"/>
      </svg>

      <button class="total-btn" id="totalBtn" aria-label="Add 20 shekel">
        <span class="amount-wrap">
          <span class="amount" id="totalAmount">0</span>
          <span class="currency">₪</span>
        </span>
      </button>
    </main>

    <section class="log-section">
      <div class="log-header">
        <span class="log-title">LOG</span>
        <span class="log-count" id="logCount">0 entries</span>
      </div>
      <ul class="log-list" id="logList">
        <li class="log-empty">No entries yet</li>
      </ul>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
